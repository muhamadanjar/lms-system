name: Release

# Semantic Release runs only after a push to a production branch.
# Conventional Commits determine the next numeric X.Y.Z version.
on:
  push:
    branches:
      - main
      - master

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify config
        run: |
          npx --yes --package=semantic-release@25.0.9 semantic-release --version
          node -e "JSON.parse(require('node:fs').readFileSync('.releaserc.json', 'utf8'))"

      - name: Release (version + tag + changelog + GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/changelog@7.0.0 \
            --package=@semantic-release/exec@7.1.0 \
            --package=@semantic-release/git@11.0.1 \
            semantic-release
