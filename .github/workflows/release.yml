name: Release

# Semantic release berjalan ketika ada merge/push ke main.
# - conventional commits menentukan bump: fix -> patch, feat -> minor,
#   BREAKING CHANGE -> major (major_on_zero=false, jadi feat tetap minor di 0.x)
# - membuat tag vX.Y.Z + CHANGELOG.md + GitHub Release otomatis
# - commit release memakai [skip ci] agar tidak loop
on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install "python-semantic-release==10.*"

      - name: Verify config
        run: semantic-release --version && semantic-release generate-config

      - name: Release (version + tag + changelog + GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
